<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-label="Projet Pulse : Optimisation et surveillance de mes PC : analyse notée sur 100, 42 réglages Windows annulables, nettoyage, espace disque, santé batterie, profil Jeu automatique. Tourne sans droits admin (UAC par lot).">
