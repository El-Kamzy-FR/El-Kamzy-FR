<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Charly · El-Kamzy-FR — Administration systèmes et réseaux, cloud Microsoft et automatisation">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .name { font: 700 64px 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif; letter-spacing: -1px; }
      .role { font: 600 22px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E4E4E7; }
      .meta { font: 400 16px 'Segoe UI', Inter, system-ui, sans-serif; fill: #A1A1AA; }
      .mono { font: 500 15px 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .pulse { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4.5s ease-in-out infinite; }
      .dot { animation: blink 1.1s steps(1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 900; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -900; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#09090B"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowV)"/>
    <rect width="1200" height="320" fill="url(#glowC)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#26262B"/>

    <!-- Texte -->
    <text x="64" y="118" class="name" fill="url(#accent)">Charly</text>
    <text x="68" y="54" class="mono" fill="#71717A">@El-Kamzy-FR · github</text>
    <text x="66" y="162" class="role">Administration systèmes &amp; réseaux · Cloud Microsoft · Automatisation</text>
    <text x="66" y="194" class="meta">Licence Administrateur Systèmes et Réseaux en alternance · BTS GMSI obtenu</text>

    <!-- Invite PowerShell -->
    <rect x="64" y="226" width="520" height="44" rx="10" fill="#151518" stroke="#26262B"/>
    <text x="84" y="254" class="mono"><tspan fill="#22D3EE">PS&gt;</tspan><tspan fill="#E4E4E7"> Get-Projet</tspan><tspan fill="#8B5CF6"> -Nom</tspan><tspan fill="#E4E4E7"> Nexus, Pulse, StationBlanche</tspan></text>
    <rect x="560" y="240" width="9" height="18" fill="#22D3EE" class="dot"/>

    <!-- Trace « pulse » (clin d'oeil au projet Pulse) -->
    <path d="M640 200 H760 L784 150 L812 252 L840 110 L866 230 L888 200 H1136" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="pulse" d="M640 200 H760 L784 150 L812 252 L840 110 L866 230 L888 200 H1136"
          fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1136" cy="200" r="5" fill="#22D3EE"/>
    <text x="1136" y="262" class="mono" fill="#71717A" text-anchor="end">uptime: toujours en apprentissage</text>
  </g>
</svg>