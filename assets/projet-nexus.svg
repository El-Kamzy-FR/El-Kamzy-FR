<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-label="Projet Nexus : Mon launcher de jeux : Steam, Epic, Riot, Xbox et jeux autonomes dans une seule bibliothèque. Fiche par jeu, temps de jeu exact, jeux possédés non installés, mises à jour automatiques via GitHub Releases.">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="r" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <style>
      .n { font: 700 24px 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif; fill: #FAFAFA; }
      .s { font: 600 12px 'Segoe UI', Inter, system-ui, sans-serif; }
      .d { font: 400 14px 'Segoe UI', Inter, system-ui, sans-serif; fill: #A1A1AA; }
      .tag { font: 600 11.5px 'Cascadia Code', Consolas, monospace; fill: #D4D4D8; }
      .bar { animation: sweep 3.5s ease-in-out infinite alternate; }
      @keyframes sweep { from { opacity: .55; } to { opacity: 1; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="579" height="239" rx="16" fill="#0F0F12" stroke="#26262B"/>
  <rect x="0.5" y="0.5" width="579" height="239" rx="16" fill="url(#r)"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#g)" class="bar"/>
  <text x="28" y="56" class="n">🎮 Nexus</text>
  <circle cx="371" cy="42" r="4" fill="#22C55E"/>
  <text x="552" y="46" text-anchor="end" class="s" fill="#22C55E">v1.0 · utilisé au quotidien</text>
  <text x="28" y="104" class="d">Mon launcher de jeux : Steam, Epic, Riot, Xbox et jeux</text><text x="28" y="125" class="d">autonomes dans une seule bibliothèque. Fiche par jeu,</text><text x="28" y="146" class="d">temps de jeu exact, jeux possédés non installés,</text><text x="28" y="167" class="d">mises à jour automatiques via GitHub Releases.</text>
  <rect x="28" y="196" width="29" height="24" rx="12" fill="#1C1C21" stroke="#2E2E35"/><text x="42.5" y="212" text-anchor="middle" class="tag">C#</text><rect x="65" y="196" width="37" height="24" rx="12" fill="#1C1C21" stroke="#2E2E35"/><text x="83.5" y="212" text-anchor="middle" class="tag">WPF</text><rect x="110" y="196" width="67" height="24" rx="12" fill="#1C1C21" stroke="#2E2E35"/><text x="143.5" y="212" text-anchor="middle" class="tag">.NET 10</text><rect x="185" y="196" width="60" height="24" rx="12" fill="#1C1C21" stroke="#2E2E35"/><text x="215" y="212" text-anchor="middle" class="tag">SQLite</text><rect x="253" y="196" width="120" height="24" rx="12" fill="#1C1C21" stroke="#2E2E35"/><text x="313" y="212" text-anchor="middle" class="tag">GitHub Actions</text>
</svg>